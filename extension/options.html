<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Faceit Bot — настройки</title>
<style>
  body{font-family:system-ui,sans-serif;width:380px;margin:0;padding:20px;background:#000;color:#fff}
  h2{margin:0 0 12px;font-size:18px}
  p{color:#888;font-size:13px;margin:4px 0 12px;line-height:1.5}
  input{width:100%;padding:10px;font-family:monospace;font-size:13px;box-sizing:border-box;background:#1a1a1a;color:#fff;border:1px solid #333;border-radius:8px}
  button{margin-top:12px;padding:10px 16px;font-size:14px;background:#fff;color:#000;border:none;border-radius:8px;cursor:pointer;width:100%}
  .ok{color:#3ddc84;font-size:13px;margin-top:8px;display:none}
  .hint{color:#666;font-size:12px;margin-top:14px}
</style>
</head>
<body>
  <h2>Faceit Bot</h2>
  <p>Вставь токен привязки из бота (команда <b>/facelogin</b>):</p>
  <input id="token" type="text" placeholder="link_token" autocomplete="off">
  <button id="save">Сохранить</button>
  <div class="ok" id="ok"></div>
  <p class="hint">Токен связывает расширение с твоим аккаунтом бота. Браузер должен быть открыт на faceit.com во время матча.</p>
  <script src="options.js"></script>
</body>
</html>
