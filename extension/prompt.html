<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Токен Faceit</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:480px;margin:40px auto;padding:20px;color:#222}
  h2{margin-top:0}
  textarea{width:100%;height:120px;font-family:monospace;font-size:13px;padding:10px;box-sizing:border-box}
  button{padding:10px 20px;font-size:15px;background:#000;color:#fff;border:none;border-radius:8px;cursor:pointer}
  .hint{color:#666;font-size:13px;margin-top:12px}
</style>
</head>
<body>
  <h2>Токен Faceit скопирован</h2>
  <p>Теперь отправь его в чат с ботом.</p>
  <textarea id="token" readonly></textarea>
  <button id="copy">Скопировать ещё раз</button>
  <p class="hint">После копирования откроется чат бота — вставь токен (Ctrl+V) и отправь.</p>
  <script src="prompt.js"></script>
</body>
</html>
