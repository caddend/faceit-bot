<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Faceit Tracker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0d0815;--text:#e8e0f0;--hint:#7c6890;--accent:#9b5cff;--card:#1a1128;--card2:#241634;--green:#3ddc84;--red:#ff4757;--orange:#ffa726;--yellow:#fdd835;--purple:#b388ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scaleIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(155,92,255,.15)}50%{box-shadow:0 0 30px rgba(155,92,255,.3)}}
.fade-in{animation:fadeIn .3s ease forwards}

#loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:16px}
.spinner{width:48px;height:48px;border:3px solid var(--card);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
#loading p{color:var(--hint);font-size:14px}

#error{display:none;text-align:center;padding:60px 16px;animation:fadeIn .3s}
#error .icon{font-size:48px;margin-bottom:16px}
#error h2{font-size:18px;margin-bottom:8px}
#error p{color:var(--hint);font-size:14px;line-height:1.5}

#app{display:none;padding:16px;max-width:520px;margin:0 auto}

.header-card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid rgba(155,92,255,.15);border-radius:20px;padding:24px;display:flex;align-items:center;gap:20px;margin-bottom:16px;animation:fadeIn .4s ease}
.avatar-wrap{position:relative;width:88px;height:88px;flex-shrink:0}
.avatar{width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid var(--card2);position:absolute;top:4px;left:4px}
.perf-ring{position:absolute;top:0;left:0;width:88px;height:88px;transform:rotate(-90deg)}
.perf-ring circle{fill:none;stroke-width:4}
.perf-ring .bg{stroke:rgba(255,255,255,.06)}
.perf-ring .progress{stroke-linecap:round;transition:stroke-dashoffset 1s ease,stroke .3s ease}
.perf-pct{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:800;color:var(--purple);background:var(--bg);padding:1px 6px;border-radius:8px;white-space:nowrap;z-index:2}
.player-info{flex:1;min-width:0}
.player-info .nick{font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-info .country{color:var(--hint);font-size:13px;margin-top:4px}

.elo-card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid rgba(155,92,255,.15);border-radius:20px;padding:24px;text-align:center;margin-bottom:16px;animation:fadeIn .5s ease}
.elo-card .label{color:var(--hint);font-size:12px;text-transform:uppercase;letter-spacing:1.5px}
.elo-card .value{font-size:48px;font-weight:800;margin-top:6px;background:linear-gradient(135deg,var(--purple),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.elo-card .streak{color:var(--hint);font-size:13px;margin-top:8px}

.tabs{display:flex;background:var(--card);border:1px solid rgba(155,92,255,.1);border-radius:16px;padding:4px;margin-bottom:16px;gap:2px}
.tab{flex:1;padding:12px 8px;text-align:center;border-radius:12px;font-size:13px;font-weight:600;color:var(--hint);cursor:pointer;transition:all .2s;border:none;background:none}
.tab.active{background:var(--accent);color:#fff;box-shadow:0 2px 12px rgba(155,92,255,.4)}
.tab:active{transform:scale(.95)}

.tab-content{display:none;animation:fadeIn .3s ease}
.tab-content.active{display:block}

.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stat-card{background:var(--card);border:1px solid rgba(155,92,255,.08);border-radius:16px;padding:18px;text-align:center;animation:scaleIn .3s ease}
.stat-card .label{color:var(--hint);font-size:11px;text-transform:uppercase;letter-spacing:1px}
.stat-card .value{font-size:26px;font-weight:700;margin-top:6px}

.recent-card{background:var(--card);border:1px solid rgba(155,92,255,.08);border-radius:16px;padding:18px;margin-bottom:16px}
.recent-card h3{font-size:12px;color:var(--hint);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px}
.results{display:flex;flex-wrap:wrap;gap:8px}
.result-dot{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;animation:scaleIn .3s ease}
.result-dot.win{background:var(--green)}
.result-dot.loss{background:var(--red)}

.map-row{display:flex;align-items:center;justify-content:space-between;padding:14px;background:var(--card);border:1px solid rgba(155,92,255,.08);border-radius:14px;margin-bottom:8px;animation:fadeIn .3s ease}
.map-name{font-weight:600;font-size:14px}
.map-stats{display:flex;gap:12px;font-size:12px;color:var(--hint)}
.map-stats b{color:var(--text)}
.map-bar{height:4px;border-radius:2px;margin-top:6px;overflow:hidden;background:rgba(255,255,255,.06)}
.map-bar-fill{height:100%;border-radius:2px;transition:width .6s ease}
.wr-green{background:var(--green)}
.wr-red{background:var(--red)}
.wr-orange{background:var(--orange)}

.clutch-card{background:var(--card);border:1px solid rgba(155,92,255,.08);border-radius:16px;padding:18px;margin-bottom:16px}
.clutch-card h3{font-size:12px;color:var(--hint);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px}
.clutch-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(155,92,255,.06)}
.clutch-row:last-child{border:none}
.clutch-row .label{font-size:14px;color:var(--hint)}
.clutch-row .value{font-weight:700;font-size:15px}

.perf-label{text-align:center;font-size:12px;color:var(--hint);margin-top:12px;line-height:1.5}
.perf-label b{color:var(--purple)}
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><p>Загрузка...</p></div>
<div id="error"><div class="icon">⚠️</div><h2 id="error-title">Ошибка</h2><p id="error-text"></p></div>
<div id="app">
<div class="header-card">
<div class="avatar-wrap">
<div class="perf-pct" id="perf-pct">-</div>
<svg class="perf-ring" viewBox="0 0 88 88"><circle class="bg" cx="44" cy="44" r="42"></circle><circle class="progress" id="perf-ring-progress" cx="44" cy="44" r="42" stroke-dasharray="263.89" stroke-dashoffset="263.89" stroke="#7c6890"></circle></svg>
<img id="avatar" class="avatar" alt="">
</div>
<div class="player-info"><div class="nick" id="nickname"></div><div class="country" id="country"></div></div>
</div>
<div class="elo-card"><div class="label">Faceit ELO</div><div class="value" id="elo">-</div><div class="streak" id="streak"></div></div>
<div class="perf-label" id="perf-label"></div>
<div class="tabs">
<button class="tab active" data-tab="overview">Обзор</button>
<button class="tab" data-tab="maps">Карты</button>
<button class="tab" data-tab="clutch">Детали</button>
</div>
<div class="tab-content active" id="tab-overview">
<div class="stats-grid">
<div class="stat-card"><div class="label">Матчей</div><div class="value" id="matches">-</div></div>
<div class="stat-card"><div class="label">Винрейт</div><div class="value" id="winrate">-</div></div>
<div class="stat-card"><div class="label">K/D</div><div class="value" id="kd">-</div></div>
<div class="stat-card"><div class="label">HS%</div><div class="value" id="hs">-</div></div>
<div class="stat-card"><div class="label">ADR</div><div class="value" id="adr">-</div></div>
<div class="stat-card"><div class="label">Урон</div><div class="value" id="dmg">-</div></div>
</div>
<div class="recent-card"><h3>Последние игры</h3><div class="results" id="results"></div></div>
</div>
<div class="tab-content" id="tab-maps"></div>
<div class="tab-content" id="tab-clutch"></div>
</div>
<script>
var tg=window.Telegram.WebApp;tg.ready();tg.expand();
var RING_CIRC=263.89;

// Level colors: 1=gray, 2-3=green, 4-7=yellow, 8-9=orange, 10=red
function levelColor(l){if(l<=1)return '#8a9aa3';if(l<=3)return '#3ddc84';if(l<=7)return '#fdd835';if(l<=9)return '#ffa726';return '#ff4757';}

// Performance ring color: empty=gray, half=yellow, full=red
function perfColor(score){if(score<30)return '#ff4757';if(score<50)return '#ffa726';if(score<70)return '#fdd835';if(score<85)return '#3ddc84';return '#b388ff';}

function perfLabel(score){if(score<30)return ' играет ниже своего уровня';if(score<50)return ' слабо на свой уровень';if(score<70)return ' играет нормально';if(score<85)return ' играет хорошо';return ' играет выше своего уровня';}

function showError(t,txt){document.getElementById('loading').style.display='none';var e=document.getElementById('error');e.style.display='block';document.getElementById('error-title').textContent=t;document.getElementById('error-text').textContent=txt;}

function renderPerfRing(score){var offset=RING_CIRC*(1-score/100);var ring=document.getElementById('perf-ring-progress');ring.style.strokeDashoffset=offset;ring.style.stroke=perfColor(score);var pct=document.getElementById('perf-pct');pct.textContent=score+'%';pct.style.color=perfColor(score);var lbl=document.getElementById('perf-label');lbl.innerHTML='Оценка игры: <b>'+score+'/100</b> — игрок '+perfLabel(score);}

function renderMaps(maps){var c=document.getElementById('tab-maps');if(!maps||!maps.length){c.innerHTML='<p style="color:var(--hint);padding:20px;text-align:center">Нет данных</p>';return;}c.innerHTML=maps.map(function(m){var wr=parseInt(m.winrate)||0;var cls=wr>=55?'wr-green':(wr>=45?'wr-orange':'wr-red');return '<div class="map-row fade-in"><div style="flex:1"><div class="map-name">'+m.name+'</div><div style="font-size:11px;color:var(--hint);margin-top:2px">'+m.matches+' матчей</div><div class="map-bar"><div class="map-bar-fill '+cls+'" style="width:'+wr+'%"></div></div></div><div class="map-stats"><span>WR <b>'+wr+'%</b></span><span>K/D <b>'+m.kd+'</b></span></div></div>';}).join('');}

function renderClutch(d){var c=document.getElementById('tab-clutch');var rows=[{label:'K/D рейт',val:d.kd},{label:'Винрейт',val:d.winrate+'%'},{label:'1v1 успешность',val:(d.v1_wr||'-')+'%'},{label:'1v2 успешность',val:(d.v2_wr||'-')+'%'},{label:'Энтри рейт',val:(d.entry_wr||'-')+'%'},{label:'Флешки',val:(d.flash_wr||'-')+'%'},{label:'Утилити',val:(d.util_wr||'-')+'%'},{label:'Снайпер',val:(d.sniper_wr||'-')+'%'},{label:'ADR',val:d.adr||'-'},{label:'Урон всего',val:d.dmg||'-'}];c.innerHTML='<div class="clutch-card"><h3>Детальная статистика</h3>'+rows.map(function(r){return '<div class="clutch-row fade-in"><span class="label">'+r.label+'</span><span class="value">'+r.val+'</span></div>';}).join('')+'</div>';}

function render(d){document.getElementById('loading').style.display='none';document.getElementById('app').style.display='block';document.getElementById('avatar').src=d.avatar||'';document.getElementById('nickname').textContent=d.nickname||'-';document.getElementById('country').textContent=d.country||'';document.getElementById('elo').textContent=d.elo||'-';document.getElementById('streak').textContent=d.streak?('Винстрик: '+d.streak):'';document.getElementById('matches').textContent=d.matches||'-';document.getElementById('winrate').textContent=d.winrate!==null?(d.winrate+'%'):'-';document.getElementById('kd').textContent=d.kd||'-';document.getElementById('hs').textContent=d.hs!==null?(d.hs+'%'):'-';document.getElementById('adr').textContent=d.adr||'-';document.getElementById('dmg').textContent=d.dmg||'-';var r=document.getElementById('results');r.innerHTML='';(d.recent_results||[]).forEach(function(x){var dot=document.createElement('div');dot.className='result-dot '+(x==='1'?'win':'loss');dot.textContent=x==='1'?'W':'L';r.appendChild(dot);});renderPerfRing(d.perf_score||0);renderMaps(d.maps||[]);renderClutch(d);}

document.querySelectorAll('.tab').forEach(function(tab){tab.addEventListener('click',function(){document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});document.querySelectorAll('.tab-content').forEach(function(c){c.classList.remove('active');});tab.classList.add('active');document.getElementById('tab-'+tab.dataset.tab).classList.add('active');});});

async function load(){try{var init=tg.initData||'';var resp=await fetch('/api/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:init})});var data=await resp.json();if(resp.status===404){showError('Ник не привязан',data.message||'Привяжи через /setnick.');return;}if(!resp.ok){showError('Ошибка',data.message||data.error||'Попробуй позже.');return;}render(data);}catch(e){showError('Ошибка сети','Не удалось загрузить.');}}
load();
</script>
</body>
</html>
